name: Deploy Trigger.dev tasks

# Deploys the reader (trigger/read-run.ts) and the ping task to Trigger.dev Production on every
# push to main, and on demand from the Actions tab ("Run workflow"). Follows Trigger.dev's
# CI / GitHub Actions guide (trigger.dev/docs/github-actions).
#
# Needs one repository secret: TRIGGER_ACCESS_TOKEN, a Production API key with "Deploy only"
# access (Trigger.dev dashboard -> Production -> API keys -> New API key). Without the secret the
# job skips itself, so it never fails a merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Trigger.dev Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
    steps:
      - name: Skip when the key is not set
        if: env.TRIGGER_ACCESS_TOKEN == ''
        run: echo "::notice::TRIGGER_ACCESS_TOKEN is not set in the repository secrets; skipping the Trigger.dev deploy."

      - name: Check out code
        if: env.TRIGGER_ACCESS_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Bun
        if: env.TRIGGER_ACCESS_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node
        if: env.TRIGGER_ACCESS_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: env.TRIGGER_ACCESS_TOKEN != ''
        run: bun install --frozen-lockfile

      # The CLI must match @trigger.dev/sdk exactly (the deploy fails on a mismatch), so its
      # version is read from package.json. --external-id tags the deployment with this commit;
      # re-running the workflow for an already deployed commit reports that version instead of
      # building again.
      - name: Deploy
        if: env.TRIGGER_ACCESS_TOKEN != ''
        run: |
          version=$(node -p "require('./package.json').dependencies['@trigger.dev/sdk']")
          echo "Trigger.dev CLI and SDK version: $version"
          npx -y "trigger.dev@$version" deploy --env prod --external-id "${{ github.sha }}"
